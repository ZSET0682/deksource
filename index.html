<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리프트바운드 카톤 덱소스</title>
<meta name="description" content="리프트바운드 오리진 한국어판 싱글 카드 재고·가격">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>리프트바운드</b> 카톤 덱소스<small>한국어판 · 공식 이미지</small></div>
    <div class="spacer"></div>
    <a class="btn" id="askBtn" target="_blank" rel="noopener" hidden>카톡 문의</a>
    <button class="btn cart-btn" id="openCart">장바구니 <span class="badge" id="cartCount">0</span></button>
  </div>
</header>

<main class="wrap">
  <div class="notice" id="notice" hidden></div>
  <div class="filters">
    <input class="search" id="q" type="search" placeholder="카드 이름 / 번호 검색">
    <select class="sel" id="sort">
      <option value="no">번호순</option>
      <option value="rarity">등급순</option>
      <option value="pasc">가격 낮은순</option>
      <option value="pdesc">가격 높은순</option>
    </select>
  </div>
  <div class="filters">
    <div class="chips" id="rarityChips"></div>
  </div>
  <div class="filters"><div class="chips" id="typeChips"></div></div>
  <p class="stock-guide">서사·쇼케이스와 2,000원 이상 희귀는 <b>남은 수량</b>이 정확해요. 나머지는 있음/없음만 표시하니 정확한 수량은 카톡으로 문의해 주세요.</p>
  <p class="count" id="count">불러오는 중…</p>
  <div class="grid" id="grid"></div>
</main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-label="장바구니">
  <div class="drawer-h"><h2>장바구니</h2><button class="btn ghost" id="closeCart">닫기</button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-f">
    <div class="total"><span>합계</span><b id="cartTotal">0원</b></div>
    <div class="bar"><i id="minBar"></i></div>
    <div class="hint" id="minHint"></div>
    <button class="btn gold" id="makeOrder" disabled>구매 요청 보내기</button>
    <div class="hint" id="orderGuide" hidden></div>
    <div class="hint">재고 수량, 특별 포일(+3,000원), 가격 흥정은 카톡으로 문의해 주세요.</div>
    <button class="btn ghost danger" id="clearCart">장바구니 비우기</button>
  </div>
</aside>

<script src="common.js"></script>
<script>
const RARITY_ICON = {
  common: 'a088ae851d94b5c34aa4900e8ccb4cc103144dce-354x354',
  uncommon: '808205a0f070e479107a7655e622fe15a356275b-480x410',
  rare: 'd90078e1ec2ef7cbcbba2be86da1b192c389581a-429x425',
  epic: '5e9799d87d0f8baa55f6d9bddb9750669a0f485b-455x419',
  showcase: 'a0e92b9edf3291fa62c9b35ffd6363de0d7947c0-376x426',
};
const rarityIcon = (r) => `https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/${RARITY_ICON[r]}.png?w=32&accountingTag=RB`;

let byId = {}, stock = {}, settings = { minOrder: 20000, openchat: '' };
let listings = [];   // 판매 중인 품목 (재고 있는 것만)
const filt = { q: '', rarity: new Set(), type: new Set(), sort: 'no' };
let cart = {};
try { cart = JSON.parse(localStorage.getItem('cart') || '{}'); } catch {}
const saveCart = () => { try { localStorage.setItem('cart', JSON.stringify(cart)); } catch {} };

async function init() {
  const [{ cards, byId: b }, inv] = await Promise.all([
    loadCards(),
    fetch(API + '/api/inv').then((r) => (r.ok ? r.json() : null)).catch(() => null),
  ]);
  byId = b;
  if (!inv) {
    // 재고를 못 불러왔을 때 장바구니를 건드리지 않는다 (품절로 오인해 지우지 않게)
    document.getElementById('count').textContent = '재고를 불러오지 못했어요. 잠시 후 새로고침 해주세요.';
    return;
  }
  stock = inv.items || {};
  settings = { ...settings, ...(inv.settings || {}) };
  if (settings.openchat) { const a = document.getElementById('askBtn'); a.href = settings.openchat; a.hidden = false; }
  if (settings.notice) { const n = document.getElementById('notice'); n.textContent = settings.notice; n.hidden = false; }

  for (const c of cards) {
    for (const s of skusOf(c)) {
      const it = stock[s.sku];
      if (it && it.q > 0 && it.p > 0) listings.push({ ...skuInfo(s.sku, byId), q: it.q, p: it.p });
    }
  }
  // 품절·삭제된 품목은 장바구니에서 정리, 수량은 재고까지로
  for (const sku of Object.keys(cart)) {
    const it = stock[sku];
    if (!it || !byId[sku]) delete cart[sku];
    else cart[sku] = Math.min(cart[sku], maxQty(sku));
  }
  saveCart();
  buildChips();
  render();
  renderCart();
}

function buildChips() {
  const present = (key) => new Set(listings.map((l) => l.card[key]));
  const rs = present('rarity');
  chipGroup('rarityChips', RARITY_ORDER.filter((r) => rs.has(r)).map((r) => [r, RARITY_KO[r]]), filt.rarity);
  chipGroup('typeChips', [...present('type')].map((t) => [t, t]), filt.type);
}
function chipGroup(elId, pairs, set) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  for (const [v, label] of pairs) {
    const b = document.createElement('button');
    b.className = 'chip' + (set.has(v) ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { set.has(v) ? set.delete(v) : set.add(v); b.classList.toggle('on'); render(); };
    el.appendChild(b);
  }
}

function render() {
  const q = filt.q.trim().toLowerCase();
  let list = listings.filter((l) => {
    if (filt.rarity.size && !filt.rarity.has(l.card.rarity)) return false;
    if (filt.type.size && !filt.type.has(l.card.type)) return false;
    if (q && !(l.card.name.toLowerCase().includes(q) || l.card.no.includes(q))) return false;
    return true;
  });
  // 등급순: 높은 등급(쇼케이스)부터, 같은 등급은 번호순
  if (filt.sort === 'rarity') list = [...list].sort((a, b) => RARITY_ORDER.indexOf(b.card.rarity) - RARITY_ORDER.indexOf(a.card.rarity));
  if (filt.sort === 'pdesc') list = [...list].sort((a, b) => b.p - a.p);
  if (filt.sort === 'pasc') list = [...list].sort((a, b) => a.p - b.p);

  document.getElementById('count').textContent = listings.length
    ? `판매 중 ${listings.length}종 중 ${list.length}종`
    : '지금은 판매 중인 카드가 없어요.';
  const grid = document.getElementById('grid');
  grid.innerHTML = list.map((l) => {
    const c = l.card;
    const inCart = cart[l.sku] || 0;
    return `<article class="card" data-sku="${l.sku}">
      <div class="thumb" data-view="${c.id}">
        <img loading="lazy" src="${imgUrl(c, 360)}" alt="${esc(c.name)}" class="${c.landscape ? 'land' : ''}">
      </div>
      <div class="info">
        <div class="name">${esc(c.name)}</div>
        <div class="meta">
          <span class="r ${c.rarity}"><img src="${rarityIcon(c.rarity)}" alt="">${RARITY_KO[c.rarity]}</span>
          <span>${c.no}</span><span>${esc(c.type)}</span>
        </div>
        <div class="price-row"><span class="price">${won(l.p)}</span>${isCounted(c, l.p)
          ? `<span class="stock ${l.q <= 1 ? 'low' : ''}">${l.q}장 남음</span>`
          : '<span class="stock">재고 있음</span>'}</div>
        ${c.rarity === 'uncommon' ? `<div class="sub-note">포일 +${won(UNCOMMON_FOIL_EXTRA)} · 재고 문의</div>` : ''}
        <div class="add-row">${inCart
          ? `<div class="step" style="flex:1;justify-content:space-between"><button data-dec="${l.sku}">−</button><span>${inCart}</span><button data-inc="${l.sku}">＋</button></div>`
          : `<button class="btn" data-inc="${l.sku}">담기</button>`}${settings.openchat
          ? `<button class="btn ghost ask" data-ask="${l.sku}" title="흥정·문의">문의</button>` : ''}</div>
      </div>
    </article>`;
  }).join('');
}

function maxQty(sku) {
  return isCounted(byId[sku], stock[sku].p) ? stock[sku].q : CART_MAX;
}

function changeQty(sku, d) {
  const it = stock[sku];
  if (!it) return;
  const max = maxQty(sku);
  const next = Math.max(0, Math.min(max, (cart[sku] || 0) + d));
  if (d > 0 && next === (cart[sku] || 0)) toast(isCounted(byId[sku], it.p) ? `남은 재고가 ${max}장이에요` : `한 번에 ${max}장까지 담을 수 있어요`);
  if (next) cart[sku] = next; else delete cart[sku];
  saveCart();
  render();
  renderCart();
}

function cartLines() {
  return Object.entries(cart).map(([sku, qty]) => {
    const info = skuInfo(sku, byId);
    return { ...info, qty, p: stock[sku].p };
  }).sort((a, b) => a.sku.localeCompare(b.sku));
}

function renderCart() {
  const lines = cartLines();
  const total = lines.reduce((s, l) => s + l.p * l.qty, 0);
  const count = lines.reduce((s, l) => s + l.qty, 0);
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartTotal').textContent = won(total);
  const min = settings.minOrder || 0;
  document.getElementById('minBar').style.width = (min ? Math.min(100, (total / min) * 100) : 100) + '%';
  const hint = document.getElementById('minHint');
  if (total < min) {
    // 안내 문장과 남은 금액은 따로 표시 (장바구니가 비어 있으면 남은 금액은 생략)
    hint.innerHTML = `<span>${won(min)}부터 구매할 수 있어요</span>` +
      (total ? `<span class="remain">남은 금액 <b>${won(min - total)}</b></span>` : '');
    hint.className = 'hint min-row';
  } else {
    hint.textContent = `구매 가능해요. 아래 버튼을 누르면 주문서가 복사되고${settings.openchat ? ' 오픈채팅이 열려요.' : '요.'}`;
    hint.className = 'hint';
  }
  document.getElementById('makeOrder').disabled = !lines.length || total < min;
  document.getElementById('orderGuide').hidden = true;
  document.getElementById('cartBody').innerHTML = lines.length ? lines.map((l) => `
    <div class="line">
      <img src="${imgUrl(l.card, 120)}" alt="">
      <div class="l-main">
        <div class="l-name">${esc(l.card.name)}</div>
        <div class="l-sub">${l.card.no} · ${RARITY_KO[l.card.rarity]} · ${won(l.p)}</div>
        <div class="step" style="margin-top:6px"><button data-dec="${l.sku}">−</button><span>${l.qty}</span><button data-inc="${l.sku}">＋</button></div>
      </div>
      <div class="l-sum">${won(l.p * l.qty)}</div>
    </div>`).join('') : '<p class="empty">장바구니가 비어 있어요</p>';
}

async function makeOrder() {
  const lines = cartLines();
  const total = lines.reduce((s, l) => s + l.p * l.qty, 0);
  const link = new URL(`order.html?id=${newOrderId()}&o=${encodeOrder(lines)}`, location.href).href;
  const text = [
    '[리프트바운드 카톤 덱소스 구매 요청]',
    ...lines.map((l) => `· ${l.card.name} (${l.card.no}) ×${l.qty} = ${won(l.p * l.qty)}`),
    `합계 ${won(total)}`,
    '',
    '주문서: ' + link,
  ].join('\n');
  await copyText(text);
  const g = document.getElementById('orderGuide');
  g.hidden = false;
  g.innerHTML = `주문서가 복사됐어요. ${settings.openchat ? '오픈채팅에' : '판매자에게'} <b>붙여넣기</b>해서 보내주세요.<div class="order-box" style="margin-top:8px">${esc(link)}</div>`;
  toast('주문서 복사됨');
  if (settings.openchat) window.open(settings.openchat, '_blank');
}

async function askAbout(sku) {
  const c = byId[sku];
  await copyText(`[문의] ${c.name} (${c.no}) · 판매가 ${won(stock[sku].p)}
`);
  toast('카드 정보가 복사됐어요. 오픈채팅에 붙여넣고 문의해 주세요');
  window.open(settings.openchat, '_blank');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-inc],[data-dec],[data-view],[data-ask]');
  if (!t) return;
  if (t.dataset.ask) return askAbout(t.dataset.ask);
  if (t.dataset.inc) changeQty(t.dataset.inc, 1);
  else if (t.dataset.dec) changeQty(t.dataset.dec, -1);
  else if (t.dataset.view) openViewer(byId[t.dataset.view]);
});
const drawer = document.getElementById('drawer'), bg = document.getElementById('drawerBg');
const showCart = (on) => { drawer.classList.toggle('show', on); bg.classList.toggle('show', on); };
document.getElementById('openCart').onclick = () => showCart(true);
document.getElementById('closeCart').onclick = () => showCart(false);
bg.onclick = () => showCart(false);
document.getElementById('makeOrder').onclick = makeOrder;
document.getElementById('clearCart').onclick = () => {
  if (!Object.keys(cart).length || !confirm('장바구니를 비울까요?')) return;
  cart = {}; saveCart(); render(); renderCart();
};
document.getElementById('q').oninput = (e) => { filt.q = e.target.value; render(); };
document.getElementById('sort').onchange = (e) => { filt.sort = e.target.value; render(); };

init();
</script>
</body>
</html>
